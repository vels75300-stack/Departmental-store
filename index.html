<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editable Fields</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <div class="wrap">

    <div class="lock-bar">
      <label class="switch">
        <input type="checkbox" id="editToggle">
        <span class="slider"></span>
      </label>
      <span id="editLabel">Edit: OFF</span>
      <button id="changePwBtn" class="link-btn" style="display:none;">Change password</button>
    </div>

    <div id="pwPanel" class="pw-panel" style="display:none;">
      <input id="currentPw" type="password" placeholder="Current password">
      <input id="newPw" type="password" placeholder="New password (min 4 chars)">
      <input id="confirmPw" type="password" placeholder="Confirm new password">
      <div class="pw-panel-actions">
        <button id="pwSubmitBtn" class="btn btn-accent">Update password</button>
        <button id="pwCancelBtn" class="btn btn-outline">Cancel</button>
      </div>
      <div id="pwMessage" class="pw-message"></div>
    </div>

    <div class="toolbar">
      <button id="clearAllBtn" class="btn btn-outline" disabled>Clear all</button>
      <button id="addRowBtn" class="btn btn-accent" disabled>+ Row</button>
    </div>

    <div id="fieldList" class="field-list">
      {% for f in fields %}
      <div class="field-row" data-id="{{ f['id'] }}">
        <div class="field-row-top">
          <input class="label-input" type="text" value="{{ f['label'] }}" placeholder="Field name" readonly>
          <button class="remove-btn" title="Remove field" disabled>&times;</button>
        </div>
        <input class="value-input" type="text" value="{{ f['value'] }}" placeholder="&mdash;" readonly>
      </div>
      {% endfor %}
    </div>

    <button id="addRowBottom" class="add-row-dashed" disabled>+ Add row</button>
  </div>

  <template id="rowTemplate">
    <div class="field-row" data-id="">
      <div class="field-row-top">
        <input class="label-input" type="text" value="New field" placeholder="Field name">
        <button class="remove-btn" title="Remove field">&times;</button>
      </div>
      <input class="value-input" type="text" value="" placeholder="&mdash;">
    </div>
  </template>

<script>
const fieldList = document.getElementById('fieldList');
const rowTemplate = document.getElementById('rowTemplate');
const toggle = document.getElementById('editToggle');
const editLabel = document.getElementById('editLabel');
const changePwBtn = document.getElementById('changePwBtn');
const pwPanel = document.getElementById('pwPanel');
const clearAllBtn = document.getElementById('clearAllBtn');
const addRowBtn = document.getElementById('addRowBtn');
const addRowBottom = document.getElementById('addRowBottom');

let editing = false;

function setRowEditable(row, on) {
  row.querySelector('.label-input').readOnly = !on;
  row.querySelector('.value-input').readOnly = !on;
  row.querySelector('.remove-btn').disabled = !on;
}

function applyEditState() {
  document.querySelectorAll('.field-row').forEach(row => setRowEditable(row, editing));
  clearAllBtn.disabled = !editing;
  addRowBtn.disabled = !editing;
  addRowBottom.disabled = !editing;
  changePwBtn.style.display = editing ? 'inline-block' : 'none';
  editLabel.textContent = editing ? 'Edit: ON' : 'Edit: OFF';
  if (!editing) pwPanel.style.display = 'none';
}

toggle.addEventListener('change', async () => {
  if (toggle.checked) {
    const pwd = prompt('Enter password to enable editing:');
    if (pwd === null) { toggle.checked = false; return; }

    const res = await fetch('/api/check_password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pwd })
    });
    const result = await res.json();

    if (result.status !== 'ok') {
      alert('Incorrect password.');
      toggle.checked = false;
      return;
    }
    editing = true;
  } else {
    editing = false;
  }
  applyEditState();
});

changePwBtn.addEventListener('click', () => {
  pwPanel.style.display = pwPanel.style.display === 'none' ? 'block' : 'none';
  document.getElementById('pwMessage').textContent = '';
});

document.getElementById('pwCancelBtn').addEventListener('click', () => {
  pwPanel.style.display = 'none';
});

document.getElementById('pwSubmitBtn').addEventListener('click', async () => {
  const current = document.getElementById('currentPw').value;
  const next = document.getElementById('newPw').value;
  const confirmNext = document.getElementById('confirmPw').value;
  const msg = document.getElementById('pwMessage');

  if (next !== confirmNext) {
    msg.textContent = 'New passwords do not match.';
    msg.className = 'pw-message error';
    return;
  }

  const res = await fetch('/api/set_password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ current_password: current, new_password: next })
  });
  const result = await res.json();

  if (result.status === 'ok') {
    msg.textContent = 'Password updated.';
    msg.className = 'pw-message success';
    document.getElementById('currentPw').value = '';
    document.getElementById('newPw').value = '';
    document.getElementById('confirmPw').value = '';
  } else {
    msg.textContent = result.message || 'Could not update password.';
    msg.className = 'pw-message error';
  }
});

function wireRow(row) {
  const labelInput = row.querySelector('.label-input');
  const valueInput = row.querySelector('.value-input');
  const removeBtn = row.querySelector('.remove-btn');

  const save = () => {
    const id = row.dataset.id;
    if (!id) return;
    fetch('/api/update_field', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id, label: labelInput.value, value: valueInput.value })
    });
  };

  labelInput.addEventListener('change', save);
  valueInput.addEventListener('change', save);

  removeBtn.addEventListener('click', async () => {
    const id = row.dataset.id;
    row.style.opacity = '0.4';
    if (id) {
      await fetch('/api/delete_field', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: id })
      });
    }
    row.remove();
  });
}

document.querySelectorAll('.field-row').forEach(wireRow);

async function addRow() {
  const res = await fetch('/api/add_field', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ label: 'New field' })
  });
  const result = await res.json();

  const clone = rowTemplate.content.cloneNode(true);
  const row = clone.querySelector('.field-row');
  row.dataset.id = result.id;
  fieldList.appendChild(row);
  wireRow(row);
  setRowEditable(row, editing);
  row.querySelector('.label-input').focus();
  row.querySelector('.label-input').select();
}

addRowBtn.addEventListener('click', addRow);
addRowBottom.addEventListener('click', addRow);

clearAllBtn.addEventListener('click', async () => {
  if (!confirm('Clear all fields?')) return;
  await fetch('/api/clear_all', { method: 'POST' });
  fieldList.innerHTML = '';
});
</script>

</body>
</html>
