<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Departmental Store - Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <div class="wrap login-wrap">
    <div class="login-card">
      <h1 class="login-title">Log in to edit</h1>

      {% if error %}
      <div class="pw-message error">{{ error }}</div>
      {% endif %}

      <form method="POST" action="{{ url_for('login') }}" class="login-form">
        <input type="text" name="username" placeholder="Username" autofocus required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit" class="btn btn-accent">Log in</button>
      </form>

      <a href="{{ url_for('index') }}" class="link-btn back-link">Back to page</a>
    </div>
  </div>

</body>
</html>
